services:
  db:
    image: postgres:15
    profiles: ["local-state"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-srt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-srt_pass}
      - POSTGRES_DB=${POSTGRES_DB:-srt_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srt_user} -d ${POSTGRES_DB:-srt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    profiles: ["local-state"]
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    profiles: ["control-plane"]
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: always
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    ports:
      - "${API_BIND_IP:-10.75.51.40}:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://srt_user:srt_pass@db:5432/srt_db}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - UDP_MULTICAST_PORT_MIN=${UDP_MULTICAST_PORT_MIN:-1024}
      - UDP_MULTICAST_PORT_MAX=${UDP_MULTICAST_PORT_MAX:-65535}
      - MAX_FULL_HLS_SERVICES=${MAX_FULL_HLS_SERVICES:-2}
      - HLS_MIN_FREE_BYTES=${HLS_MIN_FREE_BYTES:-1000000000}
      - HLS_STORAGE_QUOTA_BYTES=${HLS_STORAGE_QUOTA_BYTES:-0}
      - INTERFACE_INVENTORY_JSON=${INTERFACE_INVENTORY_JSON:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ${PREVIEW_STORAGE:-shared_previews}:/app/frontend/previews

  worker-primary:
    build: .
    profiles: ["primary-worker"]
    command: python -m worker.worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
        required: false
    network_mode: host
    environment:
      - WORKER_REDIS_URL=${WORKER_REDIS_URL:?WORKER_REDIS_URL is required}
      - NODE_ROLE=primary
      - UDP_MULTICAST_PORT_MIN=${UDP_MULTICAST_PORT_MIN:-1024}
      - UDP_MULTICAST_PORT_MAX=${UDP_MULTICAST_PORT_MAX:-65535}
      - MAX_FULL_HLS_SERVICES=${MAX_FULL_HLS_SERVICES:-2}
      - HLS_MIN_FREE_BYTES=${HLS_MIN_FREE_BYTES:-1000000000}
      - HLS_STORAGE_QUOTA_BYTES=${HLS_STORAGE_QUOTA_BYTES:-0}
      - PYTHONUNBUFFERED=1
    volumes:
      - ${PREVIEW_STORAGE:-shared_previews}:/app/frontend/previews

  worker-backup:
    build: .
    profiles: ["backup-worker"]
    command: python -m worker.worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
        required: false
    network_mode: host
    environment:
      - WORKER_REDIS_URL=${WORKER_REDIS_URL:?WORKER_REDIS_URL is required}
      - NODE_ROLE=backup
      - UDP_MULTICAST_PORT_MIN=${UDP_MULTICAST_PORT_MIN:-1024}
      - UDP_MULTICAST_PORT_MAX=${UDP_MULTICAST_PORT_MAX:-65535}
      - MAX_FULL_HLS_SERVICES=${MAX_FULL_HLS_SERVICES:-2}
      - HLS_MIN_FREE_BYTES=${HLS_MIN_FREE_BYTES:-1000000000}
      - HLS_STORAGE_QUOTA_BYTES=${HLS_STORAGE_QUOTA_BYTES:-0}
      - PYTHONUNBUFFERED=1
    volumes:
      - ${PREVIEW_STORAGE:-shared_previews}:/app/frontend/previews

  telemetry:
    build: .
    profiles: ["control-plane"]
    command: python -m telemetry.main
    restart: always
    depends_on:
      redis:
        condition: service_healthy
        required: false
    environment:
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - PYTHONUNBUFFERED=1

  prometheus:
    image: prom/prometheus:latest
    profiles: ["control-plane"]
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - telemetry

  grafana:
    image: grafana/grafana:latest
    profiles: ["control-plane"]
    restart: always
    ports:
      - "${GRAFANA_BIND_IP:-10.75.15.3}:4000:3000"
      - "${GRAFANA_ALT_BIND_IP:-10.75.51.40}:4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-storage:
  shared_previews:
